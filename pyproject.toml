[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-django"
version = "0.1.0"
description = "Modular Django boilerplate"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}  # ✅ Correct format
authors = [
  {name = "Sivakumar, Selva", email = "techsiva33@gmail.com"},
]
dependencies = [
  "Django>=3.2",
  "djangorestframework>=3.14"
]
